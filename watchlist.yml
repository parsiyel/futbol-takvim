# --- Beşiktaş takvimi (besiktas.ics): tüm maçlar, üç alarm ---
besiktas_alerts:
  morning: "11:00"     # maç günü sabah (TR saati); maç bundan önceyse atlanır
  minutes: [60, 0]     # maçtan 60 dk önce + maç anında

# --- Futbol takvimi (futbol.ics) ---
# Takvime girecek maçlar. Lig listede yoksa tüm maçları girer.
include:
  SL: [Fenerbahçe, Galatasaray, Trabzonspor]   # Beşiktaş zaten kendi takviminde
  PL: [Hull, Arsenal, Chelsea, Liverpool, Man City, Man Utd, Spurs]

# Alarmlı olacaklar (🔔). teams: bu takımların tüm maçları; matches: tek maç ("A-B", sıra önemsiz)
teams: []
matches: []
rules:
  sl_derbies: true   # SL: Beşiktaş/FB/GS/TS birbirleriyle
  pl_big6: true      # PL: Big 6 birbirleriyle
  eu_from_qf: true   # ŞL/AL/Konferans: çeyrek final ve sonrası
  eu_tr_teams: true  # Avrupa'da Türk takımları
  eu_trt: true       # TRT 1'de yayınlanan maç
alerts_minutes: [60, 15]

# Feed'lerde olmayan maçlar (Avrupa eleme turları vb.). Saat Türkiye saati. Beşiktaş takvimine, alarmlı.
manual:
  - date: "2026-08-20 20:00"
    home: Beşiktaş
    away: Kauno Žalgiris
    note: "Avrupa Ligi Play-off, ilk maç (Tüpraş)"
    channel: "TRT 1 / S Sport Plus (teyit edilmedi)"
  - date: "2026-08-27 20:00"
    home: Kauno Žalgiris
    away: Beşiktaş
    note: "Avrupa Ligi Play-off, rövanş (Kaunas) — saat teyit edilmedi"
    channel: "teyit edilmedi"
  - date: "2026-08-26 22:00"
    home: Lyon
    away: Fenerbahçe
    note: "Şampiyonlar Ligi Play-off, rövanş (ilk maç 1-1)"
    channel: "TRT 1 (teyit edilmedi)"
  - date: "2026-08-27 22:00"
    home: Ferencváros
    away: Trabzonspor
    note: "Avrupa Ligi Play-off, rövanş (Budapeşte)"
    channel: "teyit edilmedi"
