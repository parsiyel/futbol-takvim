name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /tmp/espn.json -w "ESPN HTTP %{http_code}\n" -A "Mozilla/5.0" "https://site.api.espn.com/apis/site/v2/sports/soccer/tur.1/scoreboard?dates=20260801-20260930&limit=500"
          head -c 600 /tmp/espn.json; echo
          curl -s -o /tmp/tff.html -w "TFF HTTP %{http_code}\n" -A "Mozilla/5.0" "https://www.tff.org/default.aspx?pageID=198"
          wc -c /tmp/tff.html
